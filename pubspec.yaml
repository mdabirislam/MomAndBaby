name: pregnancy_care
description: "Mom & Baby — Personal Pregnancy Companion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  # riverpod_annotation: ^2.3.5

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # UI & UX
  google_fonts: ^9.0.0
  lottie: ^3.1.2
  intl: ^0.20.3
  flutter_svg: ^2.0.10+1

  # Native & Hardware
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  home_widget: ^0.6.0
  shared_preferences: ^2.3.2

  # Security & Backup
  cryptography: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  # riverpod_generator: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/animations/
    - assets/images/
    - assets/icons/

